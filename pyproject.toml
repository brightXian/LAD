[project]
name = "lad-project"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.12.0",
  "aiohappyeyeballs>=2.6.1",
  "aiohttp>=3.13.3",
  "aiosignal>=1.4.0",
  "anyio>=4.12.1",
  "asitop>=0.0.24; sys_platform == 'darwin'",
  "asttokens>=3.0.1",
  "async-timeout>=5.0.1",
  "attrs>=25.4.0",
  "blessed>=1.32.0",
  "certifi>=2026.2.25",
  "charset-normalizer>=3.4.4",
  "click>=8.3.1",
  "clip @ git+https://github.com/openai/CLIP.git",
  "contourpy>=1.3.2",
  "cycler>=0.12.1",
  "dashing>=0.1.0",
  "datasets>=4.6.1",
  "decorator>=5.2.1",
  "dill>=0.4.0",
  "einops>=0.8.2",
  "exceptiongroup>=1.3.1",
  "executing>=2.2.1",
  "filelock>=3.25.0",
  "fonttools>=4.61.1",
  "frozenlist>=1.8.0",
  "fsspec>=2026.2.0",
  "ftfy>=6.3.1",
  "h11>=0.16.0",
  "hf-xet>=1.3.2",
  "httpcore>=1.0.9",
  "httpx[socks]>=0.28.1",
  "huggingface_hub>=0.36.2",
  "idna>=3.11",
  "ipython>=8.38.0",
  "jedi>=0.19.2",
  "Jinja2>=3.1.6",
  "kiwisolver>=1.4.9",
  "markdown-it-py>=4.0.0",
  "MarkupSafe>=3.0.3",
  "matplotlib>=3.10.8",
  "matplotlib-inline>=0.2.1",
  "mdurl>=0.1.2",
  "modelscope>=1.34.0",
  "mpmath>=1.3.0",
  "multidict>=6.7.1",
  "multiprocess>=0.70.18",
  "networkx>=3.4.2",
  "numpy>=2.2.6",
  "packaging>=26.0",
  "pandas>=2.3.3",
  "parso>=0.8.6",
  "pexpect>=4.9.0",
  "pillow>=12.1.1",
  "prompt_toolkit>=3.0.52",
  "propcache>=0.4.1",
  "psutil>=7.2.2",
  "ptyprocess>=0.7.0",
  "pure_eval>=0.2.3",
  "pyarrow>=23.0.1",
  "Pygments>=2.19.2",
  "pyparsing>=3.3.2",
  "python-dateutil>=2.9.0.post0",
  "pytz>=2026.1.post1",
  "PyYAML>=6.0.3",
  "regex>=2026.2.28",
  "requests>=2.32.5",
  "rich>=14.3.3",
  "ruff>=0.15.4",
  "safetensors>=0.7.0",
  "shellingham>=1.5.4",
  "six>=1.17.0",
  "stack-data>=0.6.3",
  "sympy>=1.14.0",
  "timm>=1.0.25",
  "tokenizers>=0.21.4",
  "torch>=2.5.0",
  "torchvision>=0.20.0",
  "tqdm>=4.67.3",
  "traitlets>=5.14.3",
  "transformers==4.53.0",
  "triton>=3.0.0; sys_platform == 'linux'",
  "typer>=0.24.1",
  "typer-slim>=0.24.0",
  "typing_extensions>=4.15.0",
  "tzdata>=2025.3",
  "urllib3>=2.6.3",
  "wcwidth>=0.6.0",
  "xxhash>=3.6.0",
  "yarl>=1.23.0",
]

[project.optional-dependencies]
dev = ["pre-commit>=4.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["backup"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "SIM", # flake8-simplify
  "RUF", # ruff-specific rules
]
ignore = [
  "E501", # line too long (handled by formatter)
  "B008", # do not perform function calls in default arguments
  "B905", # zip() without explicit strict=
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
